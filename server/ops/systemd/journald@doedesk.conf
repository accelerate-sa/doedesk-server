# The journal of the DoeDesk services (LogNamespace=doedesk in each unit), kept apart from the
# system's so that it has a keeping time of its own.
#
# What is in it: start and stop lines, one line per error with a short code, and the nightly job's
# counts. The services write no account identifier, address, phone number, token or request body
# (the test suites check the log for them), and no line per request.
#
# Seven days, the figure the Privacy Policy gives ("Hosting provider's technical logs: Up to 7
# days") and the account export repeats ("technical request logs, kept for up to 7 days").
[Journal]
Storage=persistent
MaxRetentionSec=7day
MaxFileSec=1day
SystemMaxUse=200M
Compress=yes
ForwardToSyslog=no
